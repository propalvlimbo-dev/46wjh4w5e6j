mysql:
  host: localhost
  port: 3306
  database: elytrix
  user: elytrix
  password: ""

api:
  port: 20559
  secret: change_me
  # Оставь пустым, если backend и Minecraft на одном хосте через host.docker.internal.
  ip-whitelist: []

# Топ активных берётся из ванильной статистики сервера: world/stats/*.json.
# Сайт видит только игроков с донат-группой выше default и без staff-групп.
playtime:
  # Пусто или ["*"] = все миры с папкой stats. Можно указать конкретные: ["world", "world_nether"].
  worlds: []
  limit: 10
  include-default: false
  # Необязательно: если LuckPerms странно считает primary group, можно явно вписать донат-группы.
  # Например: [immortal, deluxe, vip]
  include-groups: []
  exclude-groups:
    - default
    - helper
    - moderator
    - curadm
    - curator
    - admin
    - owner

clans:
  export-file: plugins/ElytrixClans/export/clans.json
  limit: 10
