name: Build ElytrixSite

on:
  push:
    branches:
      - arena/01a0b161-46wjh4w5e6j
    paths:
      - 'plugins/**'
      - '.github/workflows/build-elytrixsite.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build plugin
        working-directory: plugins
        run: mvn -B clean package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ElytrixSite
          path: plugins/target/ElytrixSite.jar
