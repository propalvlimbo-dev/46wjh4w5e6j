name: Build ElytrixSite

on:
  push:
    branches:
      - arena/01a0b161-46wjh4w5e6j
    paths:
      - 'plugins/**'
      - '.github/workflows/build-elytrixsite.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0b161-46wjh4w5e6j
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build plugin
        working-directory: plugins
        run: mvn -B clean package
      - name: Commit jar
        run: |
          cp plugins/target/ElytrixSite.jar plugins/ElytrixSite.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f plugins/ElytrixSite.jar
          git commit -m "Build ElytrixSite jar [skip ci]" || exit 0
          git push origin HEAD:arena/01a0b161-46wjh4w5e6j
